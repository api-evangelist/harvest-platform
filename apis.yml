name: Harvest Platform
description: >-
  Harvest Platform was a New York City fintech startup founded in 2017 by Gabriel
  DellAccio and Namrata Baral that built a consumer investing and banking app. Its
  signature feature used artificial intelligence to identify negotiable bank fees and
  automatically negotiate refunds with major U.S. banks, later expanding into
  micro-investing, round-ups, cashback rewards, and savings tooling. The company was
  backed by Techstars and Financial Venture Studio, raising roughly $3.3M in seed
  funding. Its domain growmyharvest.com now 302-redirects to Acorns (acorns.com),
  consistent with reporting that Harvest Platform was acquired by Acorns in 2021.
  Harvest Platform was a consumer-facing mobile product and never published a public
  API, developer portal, SDKs, or OpenAPI, so it carries no technical API artifacts.
